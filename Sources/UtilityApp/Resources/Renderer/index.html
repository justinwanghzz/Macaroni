:root{color-scheme:light dark}body{font:16px/1.65 -apple-system,BlinkMacSystemFont,sans-serif;margin:30px;color:#222;background:#fff;overflow-wrap:anywhere}h1,h2,h3{line-height:1.25}pre{background:#f4f5f7;padding:14px;border-radius:6px;overflow:auto}code{font-size:.86em}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:7px;text-align:left}blockquote{border-left:3px solid #aab;padding-left:14px;color:#556}.error{color:#a33}img{max-width:100%}@media(prefers-color-scheme:dark){body{color:#ddd;background:#202124}pre{background:#303136}td,th{border-color:#555}}@media print{body{color:#111;background:white;margin:0}pre{white-space:pre-wrap}h1,h2,h3{break-after:avoid}tr,pre{break-inside:avoid}}

</style></head><body><main id="preview"></main><script src="markdown-it/dist/browser/markdown-it.umd.min.js"></script><script src="katex/dist/katex.min.js"></script><script src="katex/dist/contrib/auto-render.min.js"></script><script src="source-sync.js"></script><script>
const markdown=installSourceMaps(window.markdownit({html:false,linkify:false,typographer:false}));
function renderSource(source,revision=0){const el=document.getElementById('preview');try{setSourceRevision(revision);el.innerHTML=markdown.render(source);prepareSourcePreview();renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false}],throwOnError:false,trust:false,strict:'warn'});}catch(e){el.textContent=String(e)}return revision}
function endPDF(){document.getElementById('pdf-host')?.remove();document.body.classList.remove('exporting')}
async function beginPDF(){
 endPDF();await document.fonts.ready;
 const nodes=[...document.getElementById('preview').children].map(n=>n.cloneNode(true));
 const host=document.createElement('div');host.id='pdf-host';document.body.appendChild(host);document.body.classList.add('exporting');
 let content;function next(){const page=document.createElement('div');page.className='pdf-page';content=document.createElement('div');content.className='pdf-content';page.appendChild(content);host.appendChild(page)}next();
 for(const node of nodes){content.appendChild(node);if(content.getBoundingClientRect().height>720){node.remove();if(content.children.length){let heading=content.lastElementChild;const carry=heading&&/^H[1-6]$/.test(heading.tagName)?heading:null;if(carry)carry.remove();next();if(carry)content.appendChild(carry)}content.appendChild(node);if(content.getBoundingClientRect().height>720){endPDF();throw Error('A paragraph, code block, or table is too tall for a PDF page. Split it into smaller blocks before exporting.')}}}
 return host.children.length;
}
