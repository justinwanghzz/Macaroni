name: macOS draft
on: [push, pull_request]
jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test native engines
        run: Scripts/test.sh
      - name: Package application
        run: Scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Macaroni-macOS
          path: build/Macaroni-macOS.zip
